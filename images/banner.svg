<svg width="960" height="280" viewBox="0 0 960 280" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F081D"/>
      <stop offset="40%" stop-color="#200B3B"/>
      <stop offset="75%" stop-color="#130924"/>
      <stop offset="100%" stop-color="#0B0515"/>
    </linearGradient>

    <!-- Glowing Border Gradient -->
    <linearGradient id="borderGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EC4899"/>
      <stop offset="30%" stop-color="#8B5CF6"/>
      <stop offset="70%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>

    <!-- Text Gradient -->
    <linearGradient id="textGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="40%" stop-color="#F3E8FF"/>
      <stop offset="80%" stop-color="#E9D5FF"/>
      <stop offset="100%" stop-color="#F472B6"/>
    </linearGradient>

    <!-- Pill Gradient -->
    <linearGradient id="pillGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#714B67" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#9333EA" stop-opacity="0.9"/>
    </linearGradient>

    <!-- Badge Background -->
    <linearGradient id="badgeBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.04"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="25" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .hero-title {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      font-weight: 800;
      font-size: 38px;
      letter-spacing: 2px;
      fill: url(#textGradient);
    }
    .badge-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-weight: 700;
      font-size: 11px;
      letter-spacing: 1.5px;
      fill: #FDF4FF;
    }
    .subtitle {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-weight: 500;
      font-size: 15px;
      fill: #C084FC;
      letter-spacing: 0.5px;
    }
    .tagline {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-weight: 400;
      font-size: 13px;
      fill: #94A3B8;
    }
    .tech-pill {
      font-family: 'Fira Code', monospace, sans-serif;
      font-size: 12px;
      font-weight: 600;
      fill: #E2E8F0;
    }
  </style>

  <!-- Background Rect -->
  <rect x="2" y="2" width="956" height="276" rx="16" fill="url(#bgGradient)"/>
  <rect x="2" y="2" width="956" height="276" rx="16" stroke="url(#borderGradient)" stroke-width="2" stroke-opacity="0.7"/>

  <!-- Subtle Ambient Glow Orbs -->
  <circle cx="150" cy="60" r="80" fill="#714B67" opacity="0.35" filter="url(#glow)"/>
  <circle cx="800" cy="200" r="90" fill="#6366F1" opacity="0.25" filter="url(#glow)"/>
  <circle cx="500" cy="140" r="60" fill="#EC4899" opacity="0.15" filter="url(#glow)"/>

  <!-- Decorative Grid Dots -->
  <g opacity="0.18" fill="#C084FC">
    <circle cx="50" cy="40" r="1.5"/><circle cx="90" cy="40" r="1.5"/><circle cx="130" cy="40" r="1.5"/><circle cx="170" cy="40" r="1.5"/>
    <circle cx="50" cy="80" r="1.5"/><circle cx="90" cy="80" r="1.5"/><circle cx="130" cy="80" r="1.5"/><circle cx="170" cy="80" r="1.5"/>
    <circle cx="780" cy="40" r="1.5"/><circle cx="820" cy="40" r="1.5"/><circle cx="860" cy="40" r="1.5"/><circle cx="900" cy="40" r="1.5"/>
    <circle cx="780" cy="80" r="1.5"/><circle cx="820" cy="80" r="1.5"/><circle cx="860" cy="80" r="1.5"/><circle cx="900" cy="80" r="1.5"/>
    <circle cx="780" cy="120" r="1.5"/><circle cx="820" cy="120" r="1.5"/><circle cx="860" cy="120" r="1.5"/><circle cx="900" cy="120" r="1.5"/>
  </g>

  <!-- Top Role Pill -->
  <g transform="translate(50, 42)">
    <rect width="360" height="28" rx="14" fill="url(#pillGradient)"/>
    <rect width="360" height="28" rx="14" stroke="#F472B6" stroke-width="1" stroke-opacity="0.4"/>
    <text x="180" y="18" text-anchor="middle" class="badge-text">✦ SOFTWARE ENGINEER &amp; ODOO ERP DEVELOPER ✦</text>
  </g>

  <!-- Hero Name -->
  <text x="50" y="116" class="hero-title">HIRUSHINI RASHMIKA</text>

  <!-- Subtitle -->
  <text x="50" y="146" class="subtitle">B.Sc. (Hons) Graduate • SLIIT  |  Python &amp; PostgreSQL Enterprise Specialist</text>

  <!-- Tagline -->
  <text x="50" y="172" class="tagline">Architecting custom business modules, automated tax workflows &amp; high-performance data systems.</text>

  <!-- Modern Tech Badges on Bottom -->
  <!-- Odoo Badge -->
  <g transform="translate(50, 205)">
    <rect width="125" height="36" rx="8" fill="url(#badgeBg)" stroke="#714B67" stroke-width="1.5"/>
    <circle cx="22" cy="18" r="7" fill="#714B67"/>
    <text x="42" y="23" class="tech-pill">Odoo 19/18</text>
  </g>

  <!-- Python Badge -->
  <g transform="translate(187, 205)">
    <rect width="110" height="36" rx="8" fill="url(#badgeBg)" stroke="#38BDF8" stroke-width="1.5"/>
    <circle cx="20" cy="18" r="7" fill="#38BDF8"/>
    <text x="38" y="23" class="tech-pill">Python 3</text>
  </g>

  <!-- PostgreSQL Badge -->
  <g transform="translate(309, 205)">
    <rect width="135" height="36" rx="8" fill="url(#badgeBg)" stroke="#818CF8" stroke-width="1.5"/>
    <circle cx="22" cy="18" r="7" fill="#818CF8"/>
    <text x="40" y="23" class="tech-pill">PostgreSQL</text>
  </g>

  <!-- Windows & PyCharm Badge -->
  <g transform="translate(456, 205)">
    <rect width="180" height="36" rx="8" fill="url(#badgeBg)" stroke="#A855F7" stroke-width="1.5"/>
    <circle cx="22" cy="18" r="7" fill="#A855F7"/>
    <text x="40" y="23" class="tech-pill">Windows • PyCharm</text>
  </g>

  <!-- Full-Stack Badge -->
  <g transform="translate(648, 205)">
    <rect width="160" height="36" rx="8" fill="url(#badgeBg)" stroke="#F43F5E" stroke-width="1.5"/>
    <circle cx="22" cy="18" r="7" fill="#F43F5E"/>
    <text x="40" y="23" class="tech-pill">React • Android</text>
  </g>

  <!-- Right Decorative Geometric Code Element -->
  <g transform="translate(830, 80)" opacity="0.85">
    <rect width="75" height="75" rx="18" fill="#714B67" fill-opacity="0.3" stroke="#F472B6" stroke-width="1.5"/>
    <text x="37" y="46" text-anchor="middle" font-family="monospace" font-size="28" font-weight="bold" fill="#F3E8FF">&lt;/&gt;</text>
  </g>
</svg>
